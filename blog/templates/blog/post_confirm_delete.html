<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Post</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #dc3545;
            margin-bottom: 20px;
        }

        .post-title {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .warning {
            color: #555;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Delete Post</h1>

        <p>Are you sure you want to delete this post?</p>

        <div class="post-title">
            "{{ post.title }}"
        </div>

        <p class="warning">
            This action cannot be undone.
        </p>

        <div class="buttons">

            <form method="POST">
                {% csrf_token %}

                <button type="submit" class="btn delete-btn">
                    🗑️ Yes, Delete
                </button>
            </form>

            <a href="{% url 'author_dashboard' %}"
               class="btn cancel-btn">
                Cancel
            </a>

        </div>

    </div>

</body>
</html>
